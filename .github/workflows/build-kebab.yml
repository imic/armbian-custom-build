name: Build kebab image

# Manual builds only. Run from the Actions tab ("Run workflow"),
# always dispatching from main: one dispatch builds main, test and
# test1 in parallel (matrix below), each publishing to its own
# Release tag so the three never overwrite each other:
#   main  -> tag = framework version (e.g. 26.11.1), regular release
#   test  -> tag = 26.11.1-test,  pre-release
#   test1 -> tag = 26.11.1-test1, pre-release
# When the framework version moves (e.g. to 26.11.2), bump the two
# suffixed tags in the matrix include list to match.
# NOTE: on a fork, GitHub Actions must be enabled once by the repo
# owner in the Actions tab before this workflow can run.

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board
        type: choice
        options:
          - oneplus-kebab
        default: oneplus-kebab
      release:
        description: Userspace release
        type: choice
        options:
          - resolute
        default: resolute
      target:
        description: Build target
        type: choice
        options:
          - build
          - kernel
        default: build
      desktop:
        description: Install the Xfce desktop stack
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      # One leg failing must not cancel the other two.
      fail-fast: false
      matrix:
        include:
          - branch: main
            release_tag: ""
            prerelease: "false"
          - branch: test
            release_tag: "26.11.1-test"
            prerelease: "true"
          - branch: test1
            release_tag: "26.11.1-test1"
            prerelease: "true"
    steps:
      # Check out THIS leg's branch: its userpatches are what gets
      # built. (The workflow definition itself always comes from
      # the branch the dispatch was started from - main.)
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Select minimal variant (no desktop)
        if: inputs.desktop == 'no'
        run: |
          mkdir -p userpatches/overlay/etc
          echo minimal > userpatches/overlay/etc/armbian-variant
      # Free disk space ourselves, with the composite's own pinned
      # action, but WITHOUT its "large-packages" apt purge: that purge
      # runs `apt-get remove -y ... powershell ...` with no tolerance,
      # and current GitHub runner images no longer expose powershell
      # to apt, so the remove aborts the whole job with exit 100
      # before the build starts (run #7/#8, 2026-11-06; the identical
      # workflow built fine on the previous runner image). The rm /
      # docker based categories below free nearly as much space.
      - name: Free runner disk space (no apt purge)
        uses: descriptinc/free-disk-space@1b4b157593c6801212a2ed488c205e0a810b4592
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - name: Build with the Armbian framework
        uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_board: ${{ inputs.board }}
          armbian_release: ${{ inputs.release }}
          armbian_target: ${{ inputs.target }}
          # minimal image: the desktop stack is installed by
          # userpatches/customize-image.sh (same set as the
          # reference device), not by the framework desktop recipe.
          armbian_ui: "minimal"
          # The composite's own clean step is the fragile apt purge
          # described above; ours already ran, so skip it.
          armbian_runner_clean: ""
          # Per-leg release routing. Empty tag = the composite's
          # default (the framework version, today's behaviour for
          # main); the test legs publish to their own pre-release
          # tags instead of overwriting the main release.
          armbian_release_tag: ${{ matrix.release_tag }}
          armbian_release_prerelease: ${{ matrix.prerelease }}
          armbian_release_title: "Armbian image (${{ matrix.branch }})"
